[package]
name = "beacon-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CUDA layer: nvcc->PTX build, cudarc device/stream/arena, typed launchers, cublasLt fp8"
build = "build.rs"

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
beacon-core = { workspace = true }
cudarc = { workspace = true, optional = true }

[dev-dependencies]
beacon-adjoint-table = { workspace = true }
